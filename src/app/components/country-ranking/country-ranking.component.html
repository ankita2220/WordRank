<div class="main-wrapper" style="background-image: url('assets/images/earth-bg.jpg'); background-size: cover; background-position: center; background-attachment: fixed;">

  <div class="sidebar">
    <div class="total-count">Found {{ filteredCountries.length }} countries</div>

    <h4 class="sidebar-heading">Sort By</h4>
    <select [(ngModel)]="sortBy" (change)="onSortChange()" class="sort-select">
      <option value="population">Population</option>
      <option value="area">Area</option>
      <option value="name">Name</option>
    </select>

    <h4 class="sidebar-heading">Region</h4>
    <div class="filter-group">
      <div class="filter-button" (click)="filterByRegion('Africa')">Africa</div>
      <div class="filter-button" (click)="filterByRegion('Americas')">Americas</div>
      <div class="filter-button" (click)="filterByRegion('Antarctic')">Antarctic</div>
      <div class="filter-button" (click)="filterByRegion('Asia')">Asia</div>
      <div class="filter-button" (click)="filterByRegion('Europe')">Europe</div>
      <div class="filter-button" (click)="filterByRegion('Oceania')">Oceania</div>
    </div>

    <h4 class="sidebar-heading">Status</h4>
    <div class="checkbox-group">
      <label class="checkbox-label">
        <input type="checkbox" [(ngModel)]="isUNMember" (change)="onStatusChange()" />
        Member of the United Nations
      </label>
      <label class="checkbox-label">
        <input type="checkbox" [(ngModel)]="isIndependent" (change)="onStatusChange()" />
        Independent
      </label>
    </div>
  </div>

  <div class="content-area">
    <div class="table-wrapper">
      <div class="table-header">
        <input
          type="text"
          class="search-input"
          [(ngModel)]="searchText"
          (input)="onSearchChange()"
          placeholder="Search by Name, Region, Subregion"
        />
      </div>

      <table class="country-table">
        <thead>
          <tr>
            <th>Flag</th>
            <th>Name</th>
            <th>Population</th>
            <th>Area (km²)</th>
            <th>Region</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let country of paginatedCountries" (click)="goToDetail(country.cca3)">
            <td><img class="flag-img" [src]="country.flags.png" /></td>
            <td>{{ country.name.common }}</td>
            <td>{{ country.population | number }}</td>
            <td>{{ country.area | number }}</td>
            <td>{{ country.region }}</td>
          </tr>
        </tbody>
      </table>

      <div class="pagination" *ngIf="totalPages > 1">
        <button 
          *ngFor="let page of [].constructor(totalPages); let i = index"
          (click)="changePage(i + 1)"
          [class.active]="currentPage === i + 1">
          {{ i + 1 }}
        </button>
      </div>
    </div>
  </div>
</div>
